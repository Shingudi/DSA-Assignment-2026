syntax = "proto3";

package rental;

// ============================================================
// ENUMS
// ============================================================

enum PropertyStatus {
  AVAILABLE        = 0;
  UNAVAILABLE      = 1;
  UNDER_RENOVATION = 2;
  OCCUPIED         = 3;
}

enum UserRole {
  GUEST = 0;   // safe default
  HOST  = 1;
}

enum BookingStatus {
  PENDING   = 0;
  CONFIRMED = 1;
  CANCELLED = 2;
}

// ============================================================
// CORE MESSAGES
// ============================================================

message Property {
  string         property_id     = 1;
  string         host_id         = 2;
  string         name            = 3;
  string         location        = 4;   // e.g. "Colombo 03"
  string         region          = 5;   // e.g. "Western Province"
  string         property_type   = 6;
  double         price_per_night = 7;
  PropertyStatus status          = 8;
}

message User {
  string   user_id = 1;
  string   name    = 2;
  string   email   = 3;
  UserRole role    = 4;
  string   region  = 5;   // meaningful for HOSTs; may be empty for GUESTs
}

message Booking {
  string        booking_id   = 1;
  string        guest_id     = 2;
  string        property_id  = 3;
  string        check_in     = 4;   // ISO date "YYYY-MM-DD"
  string        check_out    = 5;   // ISO date "YYYY-MM-DD"
  double        total_cost   = 6;
  BookingStatus status       = 7;
}

// ============================================================
// 1. add_property  (unary)
// ============================================================

message AddPropertyRequest {
  string host_id         = 1;
  string name            = 2;
  string location        = 3;
  string property_type   = 4;
  double price_per_night = 5;
}

message AddPropertyResponse {
  string property_id = 1;
  string message     = 2;
}

// ============================================================
// 2. create_users  (client streaming)
// ============================================================

message CreateUserRequest {
  string   name   = 1;
  string   email  = 2;
  UserRole role   = 3;
  string   region = 4;
}

message CreateUsersResponse {
  repeated string user_ids = 1;
  int32           count    = 2;
  string          message  = 3;
}

// ============================================================
// 3. update_property  (unary, partial update)
// ============================================================

message UpdatePropertyRequest {
  string                  property_id     = 1;
  optional string         name            = 2;
  optional string         location        = 3;
  optional string         property_type   = 4;
  optional double         price_per_night = 5;
  optional PropertyStatus status          = 6;
}

message UpdatePropertyResponse {
  Property property = 1;
  string   message  = 2;
}

// ============================================================
// 4. remove_property  (unary)
// ============================================================

message RemovePropertyRequest {
  string property_id = 1;
}

message RemovePropertyResponse {
  string            removed_property_id  = 1;
  repeated Property remaining_properties = 2;
  string            message              = 3;
}

// ============================================================
// 5. list_available_properties  (server streaming)
// ============================================================

message ListAvailableRequest {
  optional string location  = 1;
  optional double max_price = 2;
}

// ============================================================
// 6. search_property  (unary)
// ============================================================

message SearchPropertyRequest {
  string property_id = 1;
}

message SearchPropertyResponse {
  bool     found          = 1;
  Property property       = 2;
  string   status_message = 3;
}

// ============================================================
// 7. book_property  (unary)
// ============================================================

message BookPropertyRequest {
  string guest_id    = 1;
  string property_id = 2;
  string check_in    = 3;
  string check_out   = 4;
}

message BookPropertyResponse {
  string booking_id = 1;
  string message    = 2;
}

// ============================================================
// 8. confirm_booking  (unary)
// ============================================================

message ConfirmBookingRequest {
  string booking_id = 1;
}

message ConfirmBookingResponse {
  Booking booking = 1;
  string  message = 2;
}

// ============================================================
// SERVICE
// ============================================================

service RentalService {
  rpc add_property(AddPropertyRequest)                 returns (AddPropertyResponse);
  rpc create_users(stream CreateUserRequest)           returns (CreateUsersResponse);
  rpc update_property(UpdatePropertyRequest)           returns (UpdatePropertyResponse);
  rpc remove_property(RemovePropertyRequest)           returns (RemovePropertyResponse);
  rpc list_available_properties(ListAvailableRequest)  returns (stream Property);
  rpc search_property(SearchPropertyRequest)           returns (SearchPropertyResponse);
  rpc book_property(BookPropertyRequest)               returns (BookPropertyResponse);
  rpc confirm_booking(ConfirmBookingRequest)           returns (ConfirmBookingResponse);
}